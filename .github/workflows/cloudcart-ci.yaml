name: CloudCart CI

on:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate Image Tag
      - name: Generate Image Tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Build & Push Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-frontend:${{ steps.vars.outputs.TAG }}

      # Build & Push Backend Image
      - name: Build and Push Auth Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth-service
          file: ./backend/auth-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-auth-service:${{ steps.vars.outputs.TAG }}

      # Update Helm Values
      - name: Update Helm Values
        run: |
          sed -i "s/tag:.*/tag: ${{ steps.vars.outputs.TAG }}/" helm/cloudcart/values/dev.yaml

      # Configure Git
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Commit Helm Changes
      - name: Commit Helm Values
        run: |
          git add helm/cloudcart/values/dev.yaml
          git commit -m "ci: update image tags to ${{ steps.vars.outputs.TAG }}" || echo "No changes to commit"

      # Push Changes to GitHub
      - name: Push Changes
        run: |
          git push

      # Pipeline Completed
      - name: Pipeline Completed
        run: |
          echo "CloudCart CI completed successfully."
