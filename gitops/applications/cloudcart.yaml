apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloudcart
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Sachinn-9700/CloudCart-Platform.git
    targetRevision: main
    path: helm/cloudcart

    helm:
      valueFiles:
        - values/dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudcart

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true

      